name: pr-check

on: [workflow_dispatch]

jobs:
  e2e-pr-check:
    name: e2e tests smoke
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The recipe apps are independent, so the smoke run is split in two jobs of similar length:
        # 'apps' runs only the apps listed in AI_LAB_E2E_SHARD_APPS, 'rest' runs everything else.
        shard-role: [rest, apps]
    env:
      SKIP_INSTALLATION: true
      AI_LAB_E2E_SHARD_ROLE: ${{ matrix.shard-role }}
      AI_LAB_E2E_SHARD_APPS: 'Node.js based ChatBot|Node.js Function calling|Object Detection'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: podman-desktop-extension-ai-lab
      # Set up pnpm
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false
          package_json_file: ./podman-desktop-extension-ai-lab/package.json
      # Install Node.js
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Dependabot updates this dependency and lockfile together with the binary version.
      - name: Read Podman Desktop version from the test framework dependency
        id: podman-desktop-version
        working-directory: ./podman-desktop-extension-ai-lab
        run: |
          version=$(node -p "require('./tests/playwright/package.json').devDependencies['@podman-desktop/tests-playwright']")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Podman Desktop
        id: podman-desktop-install
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@e59cd52b942e8dfcc187293c5d8e9f3831c7ac0c # v0.11.0
        with:
          version: ${{ steps.podman-desktop-version.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-26.04 ships podman 5.x natively; no questing backport needed.
      - name: Revert unprivileged user namespace restrictions
        run: |
          # allow unprivileged user namespace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Set cgroup_manager to 'cgroupfs' instead of systemd
        run: |
          mkdir -p ~/.config/containers
          cat <<EOT >> ~/.config/containers/containers.conf
          [engine]
          cgroup_manager="cgroupfs"
          EOT
          podman info

      - name: Execute pnpm in AI Lab Extension
        working-directory: ./podman-desktop-extension-ai-lab
        run: pnpm install --frozen-lockfile

      - name: Build Image
        working-directory: ./podman-desktop-extension-ai-lab
        id: build-image
        run: |
          pnpm build
          podman build -t local_ai_lab_image ./
          CONTAINER_ID=$(podman create localhost/local_ai_lab_image --entrypoint "")
          mkdir -p tests/playwright/tests/playwright/output/ai-lab-tests-pd/plugins
          podman export $CONTAINER_ID | tar -x -C tests/playwright/tests/playwright/output/ai-lab-tests-pd/plugins/
          podman rm -f $CONTAINER_ID
          podman rmi -f localhost/local_ai_lab_image:latest

      - name: Free up disk space
        uses: podman-desktop/e2e/.github/actions/disk-cleanup@6a406f8f24bacffc481553266f9ba8a5293f3077

      - name: Run E2E Smoke tests
        working-directory: ./podman-desktop-extension-ai-lab
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          NODE_OPTIONS: --no-experimental-strip-types
          DEBUGGING_PORT: 9222
          PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
          EXTENSION_PREINSTALLED: true
        run: pnpm test:e2e:smoke

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          annotate_only: true
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests:  true
          report_paths: '**/*results.xml'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-pr-check-${{ matrix.shard-role }}
          path: |
            ./**/tests/**/output/
            !./**/*.gguf
            !./**/*.bin
            !./**/output/videos/*
            !./**/output/traces/*

      - name: Upload test videos
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-pr-check-videos-${{ matrix.shard-role }}
          path: ./**/output/videos/*

      - name: Upload test traces
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-pr-check-traces-${{ matrix.shard-role }}
          path: ./**/output/traces/*
